<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <title>運営管理プレビュー | Royal Value Poker</title>
  <link rel="icon" type="image/svg+xml" href="./assets/royal-value-poker.svg">
  <link rel="stylesheet" href="./admin.css">
  <script defer src="./preview.js"></script>
  <script defer src="./admin.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="./"><img class="brand-mark" src="./assets/royal-value-poker.svg" alt="" width="44" height="44"><span class="brand-name">Royal Value<br>Poker<span class="brand-sub">OPERATIONS</span></span></a>
      <div class="nav-caption">WORKSPACE</div>
      <nav id="nav" aria-label="管理メニュー"></nav>
      <div class="sidebar-bottom"><span class="local-dot"></span><span id="environment-label">プレビュー</span><a href="../">サイトトップへ ↗</a></div>
    </aside>
    <div class="workspace">
      <div class="preview-notice"><strong>閲覧用プレビュー</strong><span>画面イメージ確認用のサンプルデータです。入力・保存・送信はできません。</span></div>
      <main id="main" tabindex="-1"><div class="loading">データを読み込んでいます…</div></main>
      <footer id="environment-footer">サンプルデータを表示しています。</footer>
    </div>
  </div>
  <nav class="mobile-bottom-nav" aria-label="スマホ用管理メニュー"><div id="mobile-nav-links" class="mobile-bottom-links"></div><button id="mobile-more-toggle" class="mobile-nav-item" type="button" aria-haspopup="dialog" aria-controls="mobile-more-dialog" aria-expanded="false"></button></nav>
  <dialog id="mobile-more-dialog" class="mobile-more-dialog" aria-labelledby="mobile-more-title"><div class="mobile-more-heading"><h2 id="mobile-more-title">その他のメニュー</h2><button class="mobile-more-close" type="button" aria-label="メニューを閉じる">閉じる</button></div><nav id="mobile-more-links" class="mobile-more-links" aria-label="その他のメニュー"></nav></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="admin-dialog-title"><div id="dialog-content"></div></dialog>
</body>
</html>
